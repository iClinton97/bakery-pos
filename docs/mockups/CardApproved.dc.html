<x-dc>

<div style="display:flex;justify-content:space-between;gap:12px;font-size:17px"><span>Plain Pies</span><span style="color:#4A5563">−2 · 20 left</span></div>

<div style="display:flex;justify-content:space-between;gap:12px;font-size:17px"><span>Large dim sim</span><span style="color:#B4440B;font-weight:700">−2 · 6 left · Low</span></div>

<div style="display:flex;flex-wrap:wrap;gap:12px;width:100%;max-width:560px">

<a href="Main.dc.html" style="flex:1 1 220px;display:flex;align-items:center;justify-content:center;min-height:64px;box-sizing:border-box;border:1px solid #D5DAE0;border-radius:12px;background:#fff;color:#1B2430;font-size:20px;font-weight:600">New order</a>
